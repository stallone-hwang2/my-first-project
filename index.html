<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyFcmApp</title>
    <base href="/my-first-project/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MyFcmApp.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>

    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>


<script>
const repoPath = '/my-first-project/';

    if ('serviceWorker' in navigator) {
        // 1. 註冊 Blazor PWA 原有的 Service Worker
        navigator.serviceWorker.register(`${repoPath}service-worker.js`);

        // 2. 註冊 Firebase Messaging Service Worker
        // 注意：確保檔案名稱完全一致（包含大小寫）
        navigator.serviceWorker.register(`${repoPath}firebase-messaging-sw.js`)
            .then(reg => console.log('FCM SW 註冊成功:', reg.scope))
            .catch(err => console.error('FCM SW 註冊失敗:', err));
    }

    // 初始化
    firebase.initializeApp({
        apiKey: "AIzaSyBjzRu6d87W9LjPhqkoo3JVVeGNyB8fnB0",
        projectId: "blazorwasmtest1",
        messagingSenderId: "692860921646",
        appId: "1:692860921646:web:4ba593d1f24ca9ee69fcbf"
    });

    const messaging = firebase.messaging();

    // 供 Blazor 調用的 JS 函式
    window.getFcmToken = async (vapidKey) => {
        try {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                return await messaging.getToken({ vapidKey: vapidKey });
            } else {
                console.warn("通知權限被拒絕");
                return null;
            }
        } catch (error) {
            console.error("獲取 Token 失敗:", error);
            return null;
        }
    };
</script>
    
</body>

</html>
