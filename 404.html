<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyFcmApp</title>
    <!-- 這裡手動改為你的 GitHub Repository 名稱 -->
    <!-- <base href="/" /> -->
    <base href="/my-first-project/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MyFcmApp.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

    <script>
        /**
         * 1. 設定全域變數
         * 在 GitHub Pages 上，這通常是你的 repository 名稱。
         * 如果是部署在個人主頁根目錄，則設為 '/'。
         */
        const GITHUB_REPO_NAME = '/my-first-project/'; 
        //const GITHUB_REPO_NAME = '/'; 

        // 初始化 Firebase
        firebase.initializeApp({
            apiKey: "AIzaSyBjzRu6d87W9LjPhqkoo3JVVeGNyB8fnB0",
            projectId: "blazorwasmtest1",
            messagingSenderId: "692860921646",
            appId: "1:692860921646:web:4ba593d1f24ca9ee69fcbf"
        });

        const messaging = firebase.messaging();

        /**
         * 2. 整合後的註冊與 Token 獲取
         */
        window.getFcmToken = async (vapidKey) => {
            try {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    console.warn("通知權限被拒絕");
                    return null;
                }

                // 強制指定 Service Worker 路徑與範圍 (Scope)
                const swUrl = `${GITHUB_REPO_NAME}firebase-messaging-sw.js`;
                
                // 先手動註冊 Service Worker
                const registration = await navigator.serviceWorker.register(swUrl, {
                    scope: GITHUB_REPO_NAME
                });

                console.log('FCM Service Worker 註冊成功，範圍為:', registration.scope);

                // 傳入 registration 物件給 Firebase，避免它去根目錄抓
                return await messaging.getToken({ 
                    vapidKey: vapidKey,
                    serviceWorkerRegistration: registration 
                });

            } catch (error) {
                console.error("獲取 Token 失敗:", error);
                return null;
            }
        };

        // 註冊原本 Blazor 的 PWA Service Worker (如果需要)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(`${GITHUB_REPO_NAME}service-worker.js`);
        }
    </script>
</body>

</html>
